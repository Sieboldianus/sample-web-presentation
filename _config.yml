theme: vgiscience-presentation-theme

# the presentation title
title: VGIscience Presentation Template

controls: true # direction arrows in the presentation
progress: true # progress bar
center: true # center vertically
width: 1280 # widescreen 1280, classic 960
transition: fade # none/fade/slide/convex/concave/zoom

baseurl: / # adjust to the path of your presentation, e.g. /my-presentation

# Don't change anything below
markdown: kramdown
markdown_ext: ignore
